<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost: Signal 91.5 – JNK Labs</title>
<meta name="description" content="Lost: Signal 91.5. A cute puzzle game. Nothing more. Don't tap the radio. Free on Google Play.">
<meta property="og:title" content="Lost: Signal 91.5">
<meta property="og:description" content="A cute puzzle game. Nothing more. Don't tap the radio. Free on Google Play.">
<meta property="og:image" content="https://jnklabs.github.io/img/og-image.png">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/lost-icon.png">
<noscript><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.jnklabs.lost&amp;referrer=utm_source%3Dwebsite"></noscript>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',system-ui,sans-serif; color:#7b4a2a;
         background:linear-gradient(180deg,#ffe2ba,#f6e2c4); padding: 16px; box-sizing: border-box; }
  .card { background:#fffaf2; border:4px solid #fff; border-radius:26px; box-shadow:0 6px 0 #e2cdb0; padding: 28px; max-width: 420px; width: 100%; text-align:center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  h1 { font-family:'Lilita One',sans-serif; font-size: 36px; margin: 14px 0 6px; }
  p { color:#8c6440; line-height:1.5; margin: 0 0 16px; }
  a.btn { display:inline-block; padding: 14px 26px; border-radius:999px; background:#5cc93c; color:#fff; text-decoration:none;
          font-weight:700; font-size: 18px; border:3px solid #fff; box-shadow:0 5px 0 #3b9a22; }
</style>
</head>
<body>
  <main class="card">
    <img src="../img/lost-icon.png" alt="Lost app icon">
    <h1>Lost</h1>
    <p>Opening Google Play…</p>
    <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.jnklabs.lost">Get it on Google Play</a>
    <p id="tip" style="display:none;font-size:14px;margin:18px 0 0">Not opening? Tap <b>&#8942;</b> at the top right and choose <b>Open in external browser</b>.</p>
  </main>
<script>
  // Short link for social posts and ads: jnklabs.github.io/lost/?s=instagram&c=reel
  // s / c become utm_source / utm_campaign in Play Console (Acquisition > Install referrers).
  var q = new URLSearchParams(location.search);
  var clean = function (v, d) { return (v || d).replace(/[^\w-]/g, '').slice(0, 40) || d; };
  var ref = 'utm_source=' + clean(q.get('s'), 'instagram') + '&utm_medium=social&utm_campaign=' + clean(q.get('c'), 'lost');
  var id = 'com.jnklabs.lost';
  var web = 'https://play.google.com/store/apps/details?id=' + id + '&referrer=' + encodeURIComponent(ref);
  document.getElementById('go').href = web;
  if (/android/i.test(navigator.userAgent)) {
    // In-app browsers (Instagram, Facebook) often block an automatic jump to another app, but allow it on a tap.
    // So the button itself opens the Play Store app; the page also tries once by itself and then stays here (no
    // redirect to the web Play page, which can't install from inside Instagram).
    var market = 'market://details?id=' + id + '&referrer=' + encodeURIComponent(ref);
    var intent = 'intent://details?id=' + id + '&referrer=' + encodeURIComponent(ref) +
      '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
    var inApp = /Instagram|FBAN|FBAV|FB_IAB/i.test(navigator.userAgent);
    var go = document.getElementById('go');
    go.href = inApp ? market : intent;
    document.querySelector('.card p').textContent = 'Tap the button to open Google Play';
    if (inApp) document.getElementById('tip').style.display = 'block';
    try { location.href = inApp ? market : intent; } catch (e) {}
  } else {
    location.replace(web);
  }
</script>
</body>
</html>
